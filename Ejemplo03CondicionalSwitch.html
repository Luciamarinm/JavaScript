<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        //Hay que castearlo a Int, ya que recogemos texto
        let opcion = parseInt(prompt("Introduce la opción deseada (1, 2 o 3"));

        switch (opcion) {
            //o usar case "1":
            case 1:
                document.write("Elegiste la opción 1 <br>");
                break;
            case 2:
                document.write("Elegiste la opción 2 <br>");
                break;
            case 3:
                document.write("Elegiste la opción 3 <br>");
                break;
            default:
                document.write("Elegiste una opción erronea <br>");
                break;
        }

        let nota = parseInt(prompt("Introduce tu nota"));

        switch (nota) {
            //o usar case "1":
            case nota >= 0 && nota <5:
                document.write(`tu nota es ${nota} suspenso`);
                break;
            case nota >= 5 && nota <7:
                document.write(`tu nota es ${nota} suficiente`);
                break;
            case nota >= 7 && nota <9:
                document.write(`tu nota es ${nota} notable`);
                break;
            case nota >= 9 && nota <=10:
                document.write(`tu nota es ${nota} sobresaliente`);
                break;
            default:
                document.write("Elegiste una opción erronea <br>");
                break;
        }

        //Ejercicio
        /*Crea un programa JavaScript que se ejecute en el navegador.
        Objetivo del ejercicio:
        Estás creando una simple aplicación meteorológica. Los datos del clima se obtienen en forma de
        códigos numéricos desde una ventana de tipo prompt, y debes convertir estos códigos en
        descripciones legibles.
        Descripción de códigos de clima:
        • 1: Día soleado
        • 2: Parcialmente nublado
        • 3: Mayormente nublado
        • 4: Lluvioso
        • 5: Nieve
        • 6: Tormenta
        La estructura switch-case debe tomar el código de clima como condición e imprimir la
        descripción correspondiente en la página web. Debes crear una opción válida en caso de que el
        usuario no introduzca en el prompt ninguna de las opciones anteriores.
        Pista: Tal vez debas utilizar la función parseInt().*/

        let clima = parseInt(prompt("Introduce un número del 1 al 6"));
        switch(clima) {
            case 1:
                document.write("Día soleado <br>");
                break;
            case 2:
                document.write("Parcialmente nublado <br>");
                break;
            case 3:
                document.write("Mayormente nublado <br>");
                break;
            case 4:
                document.write("Lluvioso <br>");
                break;
            case 5:
                document.write("Nieve <br>");
                break;
            case 6:
                document.write("Tormenta <br>");
                break;
            default:
                document.write("Elegiste una opción erronea <br>");
                break;
        }

    </script>
</body>
</html>
