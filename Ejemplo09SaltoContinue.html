<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">

        let salarios = [];
        let trabajador = 0;
    //    for(let i = 0 ; i < 5 ; i++) {
        while(trabajador < 5){
            let salario = prompt("Introduce salario del trabajador " + trabajador+1);
            
            if(salario<1000) continue; //La siguiente línea no se usa
            salarios[trabajador]=salario-(salario*0.25);
            trabajador++;
            
        }
        //Variable salario es diferente a la creada en el bucle for
        for(salario of salarios) {
            //Si no tiene salario no lo imprime
            if(!salario) continue;
            document.write(salario + "<br>");
        }

    </script>
</body>
</html>
