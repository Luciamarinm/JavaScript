<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        
        //Pueden tener cualquier tipo de dato
        let tiposDatos = [7,9,,15,"Juan",true];

        document.write(tiposDatos[2]);
        document.write("<br>");
        for(let i = 0 ; i < tiposDatos.length ; i++) {
            document.write(tiposDatos[i] + " ");
        }
        document.write("<br>");

        //For of
        for(let tipoDato of tiposDatos) {
            document.write(tipoDato + " ");
        }

        //Array multidimensional
        let datos = [[1,7,9],[5,6,8],[2,5,9]];
        document.write("<br>");
        document.write(datos[1][2]);

        //For
        for(let i = 0 ; i < datos.length ; i++) {
            document.write("<br>");
            //Para usar lenght hay que especificar en que parte del array
            for(let y = 0 ; y < datos[i].length ; y++) {
                document.write(datos[i][y] + " ");
            }
        }

        //For of
        document.write("<br>");
        for(dato of datos) {
            document.write("<br>");
            //Para usar lenght hay que especificar en que parte del array
            for(data of dato) {
                document.write(data + " ");
            }
        }

        document.write("<br>");
        let email = "luciamm@gmail.com";
        let arroba = 0;
        for(letra of email) {
            document.write(letra);
            if(letra=="@") arroba++;
        }
        document.write("<br>");
        document.write(arroba)
        document.write("<br>");
        if(arroba==1) {
            document.write("Email correcto");
        }else {
            document.write("Email incorrecto");
        }

        //Ejercicio
        /*
        Crea un programa que pida mediante ventana de prompt cinco números al usuario. Almacena
        los números introducidos por el usuario en un array utilizando un bucle for normal. A
        continuación, usando un for of que recorra el array, muestra un mensaje informando del
        resultado en el navegador de multiplicar cada uno de los números por 5.
        Ejemplo:
        Se pedirán al usuario cinco números, supongamos que introduce 2, 4, 10, 11 y 8
        A continuación, se mostrará el siguiente mensaje en el navegador:
        El resultado de multiplicar por 5 los números es:
        2 x 5 = 10
        4 x 5 = 20
        10 x 5 = 50
        11 x 5 = 55
        8 x 5 =40.
        */

        let numeros = [];
        let numero = 5;
        let valor= 0;
        for(i = 0 ; i < 5 ; i++) {
            numeros[i] = parseInt(prompt("Introduce un número"));
        }
        for(i = 0 ; i < 5 ; i++) {
            valor = numero * numeros[i];
            document.write("<br>" + numeros[i] + " x " + numero + " = " + valor);
        }

    </script>
</body>
</html>
