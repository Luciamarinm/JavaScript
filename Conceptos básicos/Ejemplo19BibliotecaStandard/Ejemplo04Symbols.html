<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        /*
        Symbols
        */
       let s1 = Symbol("Juan");
       let s2 = Symbol("Lucía");
       console.log(s1===s2);
       console.log(typeof s1);
       const alumno = {
            nombre: "Juan",
            apellido: "Marín",
            edad: 21
       };
       console.log(alumno);
       alumno.nombre="Lucía";
       console.log(alumno);
       //Para no poder cambiar datos
       const Nombre = Symbol();
       const alumno2 = {
            [Nombre]: "Juan",
            apellido: "Marín",
            edad: 22
       };
       console.log(alumno2);
       alumno.Nombre="Lucía";
       console.log(alumno2);
    </script>
</body>
</html>
