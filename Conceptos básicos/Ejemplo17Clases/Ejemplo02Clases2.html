<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        class ManejoArray extends Array {
           get primero() {
            //Te devuelve la posición 0 del array
            return this[0];
           } 
           get ultimo() {
            return this[this.length-1];
           }
        }

        let array1 = new ManejoArray();
        array1.push("Antonio", "María", "José", "Sandra");
        document.write(array1.primero+"<br>");
        document.write(array1.ultimo+"<br>");
    </script>
</body>
</html>
